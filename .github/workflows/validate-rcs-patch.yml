name: Validate microG RCS patch on Android SDK
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Source branch to compile and test (submitted or experimental)'
        required: true
        type: choice
        default: rcs-ts43-validation-and-android10-guards
        options:
          - rcs-ts43-validation-and-android10-guards
          - experiment/rcs-svc189-integration
permissions:
  contents: read
jobs:
  verify-patched-rcs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_MICROG_VERSION_WITHOUT_GIT: "1"
    steps:
      - name: Check out submitted patch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || 'rcs-ts43-validation-and-android10-guards' }}
          fetch-depth: 1
      - name: Record exact source revision
        run: git log -1 --format='%H %s'
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify runner SDK prerequisites
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -n "$ANDROID_HOME"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - name: Compile real Constellation Android library and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew :play-services-constellation-core:assembleDebug :play-services-constellation-core:testDebugUnitTest --no-daemon --console=plain --stacktrace
      - name: Build microG APK
        run: ./gradlew :play-services-core:assembleVtmDefaultDebug --no-daemon --console=plain --stacktrace
      - name: Run svc189 integration unit tests
        if: ${{ inputs.source_ref == 'experiment/rcs-svc189-integration' }}
        run: ./gradlew :play-services-core:testVtmDefaultDebugUnitTest --no-daemon --console=plain --stacktrace
      - name: Inspect compiled RCS service 189 manifest
        if: ${{ inputs.source_ref == 'experiment/rcs-svc189-integration' }}
        run: |
          apk="$(find play-services-core/build/outputs/apk -name '*.apk' -type f | head -n 1)"
          test -n "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump xmltree --file AndroidManifest.xml "$apk" > "$RUNNER_TEMP/rcs-manifest.txt"
          grep -F 'org.microg.gms.rcs.RcsService' "$RUNNER_TEMP/rcs-manifest.txt"
          grep -F 'com.google.android.gms.rcs.START' "$RUNNER_TEMP/rcs-manifest.txt"
          echo 'Compiled manifest includes the RCS service 189 implementation and intent'
      - name: Upload real APK if build succeeds
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: microg-rcs-patched-debug-apk
          path: play-services-core/build/outputs/apk/**/*.apk
          if-no-files-found: error
